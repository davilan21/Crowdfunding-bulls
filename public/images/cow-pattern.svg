<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <!-- Green gradient overlay -->
    <linearGradient id="greenOverlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#052e16;stop-opacity:0.92"/>
      <stop offset="40%" style="stop-color:#14532d;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#166534;stop-opacity:0.80"/>
    </linearGradient>

    <!-- Radial glow effects -->
    <radialGradient id="glow1" cx="80%" cy="20%" r="40%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#052e16;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="10%" cy="80%" r="35%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#052e16;stop-opacity:0"/>
    </radialGradient>

    <!-- Cow spot pattern -->
    <pattern id="cowSpots" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Random organic spots - cow pattern -->
      <ellipse cx="40" cy="35" rx="28" ry="22" fill="#000000" opacity="0.18" transform="rotate(-15 40 35)"/>
      <ellipse cx="130" cy="80" rx="35" ry="25" fill="#000000" opacity="0.15" transform="rotate(20 130 80)"/>
      <ellipse cx="80" cy="140" rx="22" ry="18" fill="#000000" opacity="0.14" transform="rotate(-8 80 140)"/>
      <ellipse cx="170" cy="160" rx="30" ry="20" fill="#000000" opacity="0.16" transform="rotate(12 170 160)"/>
      <ellipse cx="20" cy="170" rx="18" ry="14" fill="#000000" opacity="0.12" transform="rotate(-25 20 170)"/>
      <ellipse cx="155" cy="30" rx="20" ry="16" fill="#000000" opacity="0.13" transform="rotate(30 155 30)"/>
    </pattern>

    <!-- Geometric grid overlay -->
    <pattern id="hexGrid" x="0" y="0" width="60" height="52" patternUnits="userSpaceOnUse">
      <path d="M30 2 L58 17 L58 47 L30 62 L2 47 L2 17 Z" fill="none" stroke="#4ade80" stroke-width="0.4" opacity="0.2"/>
    </pattern>

    <!-- Filter for blur glow on cows -->
    <filter id="cowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softBlur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background base - dark field/meadow -->
  <rect width="1200" height="800" fill="#0a1f0f"/>

  <!-- Subtle terrain gradient at bottom -->
  <rect x="0" y="500" width="1200" height="300" fill="url(#greenOverlay)" opacity="0.3"/>

  <!-- Cow spot texture layer -->
  <rect width="1200" height="800" fill="url(#cowSpots)" opacity="0.6"/>

  <!-- === COW SILHOUETTES === -->

  <!-- Large center-right cow -->
  <g transform="translate(780, 150) scale(1.4)" opacity="0.22" fill="#1a4a2e">
    <!-- Body -->
    <ellipse cx="100" cy="160" rx="110" ry="70" />
    <!-- Head -->
    <ellipse cx="195" cy="120" rx="45" ry="38" />
    <!-- Snout -->
    <ellipse cx="228" cy="130" rx="22" ry="16" />
    <!-- Ear left -->
    <ellipse cx="185" cy="88" rx="18" ry="12" transform="rotate(-20 185 88)"/>
    <!-- Ear right -->
    <ellipse cx="210" cy="85" rx="16" ry="10" transform="rotate(15 210 85)"/>
    <!-- Horn left -->
    <path d="M182 85 Q170 60 178 45" stroke="#1a4a2e" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Horn right -->
    <path d="M208 82 Q220 58 215 42" stroke="#1a4a2e" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Legs -->
    <rect x="40" y="220" width="22" height="80" rx="8"/>
    <rect x="80" y="225" width="22" height="75" rx="8"/>
    <rect x="130" y="225" width="22" height="75" rx="8"/>
    <rect x="168" y="220" width="22" height="80" rx="8"/>
    <!-- Tail -->
    <path d="M0 155 Q-30 140 -25 175 Q-20 195 -10 185" stroke="#1a4a2e" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- Udder -->
    <ellipse cx="100" cy="228" rx="28" ry="14"/>
  </g>

  <!-- Medium left cow (facing right) -->
  <g transform="translate(50, 280) scale(0.9)" opacity="0.18" fill="#16a34a">
    <!-- Body -->
    <ellipse cx="100" cy="160" rx="110" ry="70" />
    <!-- Head -->
    <ellipse cx="195" cy="120" rx="45" ry="38" />
    <!-- Snout -->
    <ellipse cx="228" cy="130" rx="22" ry="16" />
    <!-- Ear left -->
    <ellipse cx="185" cy="88" rx="18" ry="12" transform="rotate(-20 185 88)"/>
    <!-- Ear right -->
    <ellipse cx="210" cy="85" rx="16" ry="10" transform="rotate(15 210 85)"/>
    <!-- Horn left -->
    <path d="M182 85 Q170 60 178 45" stroke="#16a34a" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Horn right -->
    <path d="M208 82 Q220 58 215 42" stroke="#16a34a" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Legs -->
    <rect x="40" y="220" width="22" height="80" rx="8"/>
    <rect x="80" y="225" width="22" height="75" rx="8"/>
    <rect x="130" y="225" width="22" height="75" rx="8"/>
    <rect x="168" y="220" width="22" height="80" rx="8"/>
    <!-- Tail -->
    <path d="M0 155 Q-30 140 -25 175 Q-20 195 -10 185" stroke="#16a34a" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- Udder -->
    <ellipse cx="100" cy="228" rx="28" ry="14"/>
  </g>

  <!-- Small distant cow top-right -->
  <g transform="translate(950, 80) scale(0.55)" opacity="0.16" fill="#22c55e">
    <ellipse cx="100" cy="160" rx="110" ry="70" />
    <ellipse cx="195" cy="120" rx="45" ry="38" />
    <ellipse cx="228" cy="130" rx="22" ry="16" />
    <ellipse cx="185" cy="88" rx="18" ry="12" transform="rotate(-20 185 88)"/>
    <ellipse cx="210" cy="85" rx="16" ry="10" transform="rotate(15 210 85)"/>
    <path d="M182 85 Q170 60 178 45" stroke="#22c55e" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M208 82 Q220 58 215 42" stroke="#22c55e" stroke-width="8" fill="none" stroke-linecap="round"/>
    <rect x="40" y="220" width="22" height="80" rx="8"/>
    <rect x="80" y="225" width="22" height="75" rx="8"/>
    <rect x="130" y="225" width="22" height="75" rx="8"/>
    <rect x="168" y="220" width="22" height="80" rx="8"/>
    <path d="M0 155 Q-30 140 -25 175 Q-20 195 -10 185" stroke="#22c55e" stroke-width="9" fill="none" stroke-linecap="round"/>
    <ellipse cx="100" cy="228" rx="28" ry="14"/>
  </g>

  <!-- Very small far cow top-center -->
  <g transform="translate(520, 40) scale(0.38)" opacity="0.12" fill="#4ade80">
    <ellipse cx="100" cy="160" rx="110" ry="70" />
    <ellipse cx="195" cy="120" rx="45" ry="38" />
    <ellipse cx="228" cy="130" rx="22" ry="16" />
    <rect x="40" y="220" width="22" height="80" rx="8"/>
    <rect x="80" y="225" width="22" height="75" rx="8"/>
    <rect x="130" y="225" width="22" height="75" rx="8"/>
    <rect x="168" y="220" width="22" height="80" rx="8"/>
  </g>

  <!-- Bottom right large cow -->
  <g transform="translate(850, 420) scale(1.1)" opacity="0.20" fill="#15803d">
    <ellipse cx="100" cy="160" rx="110" ry="70" />
    <ellipse cx="195" cy="120" rx="45" ry="38" />
    <ellipse cx="228" cy="130" rx="22" ry="16" />
    <ellipse cx="185" cy="88" rx="18" ry="12" transform="rotate(-20 185 88)"/>
    <ellipse cx="210" cy="85" rx="16" ry="10" transform="rotate(15 210 85)"/>
    <path d="M182 85 Q170 60 178 45" stroke="#15803d" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M208 82 Q220 58 215 42" stroke="#15803d" stroke-width="8" fill="none" stroke-linecap="round"/>
    <rect x="40" y="220" width="22" height="80" rx="8"/>
    <rect x="80" y="225" width="22" height="75" rx="8"/>
    <rect x="130" y="225" width="22" height="75" rx="8"/>
    <rect x="168" y="220" width="22" height="80" rx="8"/>
    <path d="M0 155 Q-30 140 -25 175 Q-20 195 -10 185" stroke="#15803d" stroke-width="9" fill="none" stroke-linecap="round"/>
    <ellipse cx="100" cy="228" rx="28" ry="14"/>
  </g>

  <!-- Scattered floating cow spots as decorative elements -->
  <!-- Large organic spot clusters -->
  <ellipse cx="650" cy="200" rx="55" ry="38" fill="#4ade80" opacity="0.06" transform="rotate(-18 650 200)"/>
  <ellipse cx="300" cy="550" rx="70" ry="45" fill="#22c55e" opacity="0.07" transform="rotate(12 300 550)"/>
  <ellipse cx="1050" cy="350" rx="60" ry="42" fill="#16a34a" opacity="0.08" transform="rotate(-5 1050 350)"/>
  <ellipse cx="150" cy="120" rx="40" ry="28" fill="#4ade80" opacity="0.05" transform="rotate(22 150 120)"/>
  <ellipse cx="900" cy="650" rx="80" ry="50" fill="#22c55e" opacity="0.06" transform="rotate(-10 900 650)"/>
  <ellipse cx="400" cy="700" rx="50" ry="35" fill="#4ade80" opacity="0.07" transform="rotate(8 400 700)"/>
  <ellipse cx="700" cy="700" rx="45" ry="32" fill="#22c55e" opacity="0.05" transform="rotate(-15 700 700)"/>

  <!-- Hex grid pattern overlay (very subtle) -->
  <rect width="1200" height="800" fill="url(#hexGrid)" opacity="0.8"/>

  <!-- Green glow overlays -->
  <rect width="1200" height="800" fill="url(#glow1)"/>
  <rect width="1200" height="800" fill="url(#glow2)"/>

  <!-- Main green gradient overlay for readability -->
  <rect width="1200" height="800" fill="url(#greenOverlay)"/>

  <!-- Left-side gradient fade for text readability -->
  <linearGradient id="textArea" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#052e16;stop-opacity:0.7"/>
    <stop offset="60%" style="stop-color:#052e16;stop-opacity:0.2"/>
    <stop offset="100%" style="stop-color:#052e16;stop-opacity:0"/>
  </linearGradient>
  <rect width="1200" height="800" fill="url(#textArea)"/>
</svg>
