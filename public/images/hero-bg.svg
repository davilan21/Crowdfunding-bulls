<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <!-- Dot grid pattern -->
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.2" fill="#4ade80" opacity="0.18"/>
    </pattern>

    <!-- Glowing node filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Large radial glow -->
    <radialGradient id="centerGlow" cx="72%" cy="45%" r="38%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.10"/>
      <stop offset="100%" style="stop-color:#022c16;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="leftGlow" cx="10%" cy="70%" r="30%">
      <stop offset="0%" style="stop-color:#16a34a;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#022c16;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Base -->
  <rect width="1440" height="900" fill="#030f07"/>

  <!-- Dot grid -->
  <rect width="1440" height="900" fill="url(#dots)"/>

  <!-- Ambient glow blobs -->
  <rect width="1440" height="900" fill="url(#centerGlow)"/>
  <rect width="1440" height="900" fill="url(#leftGlow)"/>

  <!-- Network lines — right side cluster -->
  <g stroke="#22c55e" stroke-width="0.6" opacity="0.14">
    <line x1="900" y1="120" x2="1050" y2="200"/>
    <line x1="1050" y1="200" x2="1180" y2="150"/>
    <line x1="1180" y1="150" x2="1280" y2="260"/>
    <line x1="1280" y1="260" x2="1100" y2="340"/>
    <line x1="1100" y1="340" x2="950" y2="300"/>
    <line x1="950" y1="300" x2="900" y2="120"/>
    <line x1="1050" y1="200" x2="1100" y2="340"/>
    <line x1="1180" y1="150" x2="1100" y2="340"/>
    <line x1="950" y1="300" x2="1050" y2="200"/>

    <line x1="1100" y1="340" x2="1050" y2="480"/>
    <line x1="1280" y1="260" x2="1350" y2="400"/>
    <line x1="1350" y1="400" x2="1200" y2="500"/>
    <line x1="1200" y1="500" x2="1050" y2="480"/>
    <line x1="1050" y1="480" x2="1100" y2="340"/>
    <line x1="1350" y1="400" x2="1280" y2="260"/>

    <line x1="800" y1="350" x2="950" y2="300"/>
    <line x1="800" y1="350" x2="900" y2="480"/>
    <line x1="900" y1="480" x2="1050" y2="480"/>
    <line x1="900" y1="480" x2="800" y2="600"/>
    <line x1="800" y1="600" x2="950" y2="650"/>
    <line x1="950" y1="650" x2="1050" y2="480"/>

    <!-- Upper scattered -->
    <line x1="1000" y1="60" x2="900" y2="120"/>
    <line x1="1200" y1="80" x2="1180" y2="150"/>
    <line x1="1350" y1="120" x2="1280" y2="260"/>
    <line x1="1400" y1="300" x2="1350" y2="400"/>
  </g>

  <!-- Network lines — left sparse -->
  <g stroke="#22c55e" stroke-width="0.5" opacity="0.08">
    <line x1="60" y1="200" x2="200" y2="280"/>
    <line x1="200" y1="280" x2="150" y2="420"/>
    <line x1="150" y1="420" x2="60" y2="380"/>
    <line x1="60" y1="380" x2="60" y2="200"/>
    <line x1="200" y1="280" x2="300" y2="360"/>
    <line x1="300" y1="360" x2="250" y2="500"/>
    <line x1="150" y1="420" x2="250" y2="500"/>
  </g>

  <!-- Glowing nodes — primary -->
  <g filter="url(#glow)">
    <circle cx="1050" cy="200" r="4" fill="#4ade80" opacity="0.9"/>
    <circle cx="1180" cy="150" r="3" fill="#4ade80" opacity="0.7"/>
    <circle cx="1280" cy="260" r="4.5" fill="#22c55e" opacity="0.8"/>
    <circle cx="1100" cy="340" r="3.5" fill="#4ade80" opacity="0.85"/>
    <circle cx="950" cy="300" r="3" fill="#4ade80" opacity="0.6"/>
    <circle cx="1350" cy="400" r="3.5" fill="#22c55e" opacity="0.7"/>
    <circle cx="1050" cy="480" r="4" fill="#4ade80" opacity="0.8"/>
    <circle cx="1200" cy="500" r="3" fill="#4ade80" opacity="0.65"/>
    <circle cx="900" cy="480" r="3" fill="#22c55e" opacity="0.6"/>
    <circle cx="800" cy="350" r="3" fill="#4ade80" opacity="0.55"/>
    <circle cx="950" cy="650" r="3" fill="#4ade80" opacity="0.5"/>
  </g>

  <!-- Large ambient glow nodes -->
  <g filter="url(#softGlow)" opacity="0.6">
    <circle cx="1100" cy="340" r="6" fill="#22c55e"/>
    <circle cx="1280" cy="260" r="5" fill="#4ade80"/>
  </g>

  <!-- Abstract geometric cow head (top-right, very faint) -->
  <g opacity="0.06" stroke="#4ade80" stroke-width="1" fill="none">
    <!-- Head ellipse -->
    <ellipse cx="1320" cy="700" rx="80" ry="70"/>
    <!-- Snout -->
    <ellipse cx="1370" cy="720" rx="38" ry="28"/>
    <!-- Horn left -->
    <path d="M1300 645 Q1280 600 1295 575"/>
    <!-- Horn right -->
    <path d="M1340 640 Q1365 595 1355 572"/>
    <!-- Ear left -->
    <ellipse cx="1293" cy="648" rx="22" ry="14" transform="rotate(-20 1293 648)"/>
    <!-- Eye -->
    <circle cx="1308" cy="690" r="6"/>
  </g>

  <!-- Subtle horizontal scanline at 1/3 from bottom -->
  <line x1="0" y1="600" x2="1440" y2="600" stroke="#22c55e" stroke-width="0.3" opacity="0.08"/>
  <line x1="0" y1="300" x2="1440" y2="300" stroke="#22c55e" stroke-width="0.3" opacity="0.05"/>

  <!-- Bottom fade -->
  <defs>
    <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:#030f07;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#030f07;stop-opacity:0.8"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#bottomFade)"/>
</svg>
